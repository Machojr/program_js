<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekday Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2e8b57;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #2e8b57;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #98fb98;
        }
        td {
            background-color: #e0fff0;
        }
    </style>
</head>
<body>

    <h1>Weekday Planner</h1>

    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Morning (Asubuhi)</th>
                <th>Evening (Jioni)</th>
            </tr>
        </thead>
        <tbody id="planner-table">
            <!-- Content will be generated by JS -->
        </tbody>
    </table>

    <script>
        const weekPlan = {
            "Monday": {morning: "Lugha", evening: "Hadith"},
            "Tuesday": {morning: "Quran", evening: "Aqida"},
            "Wednesday": {morning: "Hadith", evening: "Lugha"},
            "Thursday": {morning: "Aqida", evening: "Quran"},
            "Friday": {morning: "Lugha", evening: "Hadith"},
            "Saturday": {morning: "Quran", evening: "Aqida"},
            "Sunday": {morning: "Hadith", evening: "Lugha"}
        };

        const tableBody = document.getElementById("planner-table");

        for (let day in weekPlan) {
            const row = document.createElement("tr");

            const dayCell = document.createElement("td");
            dayCell.textContent = day;
            row.appendChild(dayCell);

            const morningCell = document.createElement("td");
            morningCell.textContent = weekPlan[day].morning;
            row.appendChild(morningCell);

            const eveningCell = document.createElement("td");
            eveningCell.textContent = weekPlan[day].evening;
            row.appendChild(eveningCell);

            tableBody.appendChild(row);
        }
    </script>

</body>
</html>
